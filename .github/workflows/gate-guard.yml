name: Gate-defining change guard

# Sets the required commit status "gate-review" on every PR head (decision:
# .github/scripts/gate-review.mjs). For a PR that changes a gate-defining file
# (.github/gate-defining-paths.json) it is "success" only after a human review (label
# gate-change-reviewed) and after Jenkins passed on that exact commit; ordinary PRs get "success"
# (the Jenkins checks still gate them). Every merge into main is a manual merge by the repository
# owner: auto-merge is disabled for the repository and a "restrict updates" ruleset lets only
# repository admins update main, via a pull request (docs/ci-cd.md). The guard never merges and
# cannot: it has no write access to code.
#
# Defense in depth: should auto-merge ever be re-enabled, "gate-review" is "failure" on a
# gate-defining PR while auto-merge is enabled on it. (Turning auto-merge off from here is not
# possible: the workflow token would need contents: write, "Resource not accessible by
# integration (disablePullRequestAutoMerge)", which this guard deliberately does not get.)
#
# Trusted by construction: pull_request_target and status workflows run THIS file and the scripts
# it reads from main, never from the PR. Nothing from the PR is checked out or executed; file
# lists, labels and statuses are read from the API as data.
on:
  pull_request_target:
    branches: [main]
    types:
      [
        opened,
        reopened,
        synchronize,
        ready_for_review,
        edited,
        labeled,
        unlabeled,
        auto_merge_enabled,
        auto_merge_disabled,
      ]
  # Jenkins posts continuous-integration/jenkins/pr-head when a PR build starts and finishes: the
  # status is re-evaluated so that it becomes "success" only after Jenkins passed.
  status:

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: gate-guard-${{ github.event.pull_request.number || github.event.sha }}
  cancel-in-progress: false

env:
  REVIEW_LABEL: gate-change-reviewed
  JENKINS_APP_ID: '4991392'
  JENKINS_STATUS: continuous-integration/jenkins/pr-head

jobs:
  guard:
    name: Gate-defining change guard
    if: github.event_name != 'status' || github.event.context == 'continuous-integration/jenkins/pr-head'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The base branch (main): the pattern list and the decision script only.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/gate-defining-paths.json
            .github/scripts/gate-review.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Evaluate and set gate-review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.event.sha }}
        run: |
          set -euo pipefail
          # PRs to evaluate: the event's PR, or the open PRs to main whose head is the status' commit.
          if [ "$EVENT" = "status" ]; then
            prs=$(gh api "repos/$REPO/commits/$EVENT_SHA/pulls" \
              --jq '[.[] | select(.state=="open" and .base.ref=="main" and .head.sha=="'"$EVENT_SHA"'") | .number] | join(" ")')
          else
            prs="$EVENT_PR"
          fi
          [ -n "$prs" ] || { echo "No open PR to main has head $EVENT_SHA."; exit 0; }

          for pr in $prs; do
            sha="$EVENT_SHA"
            # Fail closed: any error below posts "failure" for this commit.
            trap 'gh api -X POST "repos/$REPO/statuses/$sha" -f state=failure -f context=gate-review -f description="Guard could not evaluate this PR; blocked (fail closed)" >/dev/null || true' ERR

            gh api --paginate "repos/$REPO/pulls/$pr/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
            gate=$(node -e '
              const fs = require("fs");
              const { patterns } = JSON.parse(fs.readFileSync(".github/gate-defining-paths.json", "utf8"));
              const files = fs.readFileSync(process.env.RUNNER_TEMP + "/changed.txt", "utf8").split("\n").filter(Boolean);
              import("./.github/scripts/gate-review.mjs").then((m) => {
                const hits = m.gateDefiningPaths(patterns, files);
                console.error(hits.length ? "Gate-defining: " + hits.join(", ") : "No gate-defining file changed.");
                console.log(hits.length > 0);
              });
            ')

            # A new commit needs a new review.
            if [ "$gate" = "true" ] && [ "$ACTION" = "synchronize" ]; then
              if gh api -X DELETE "repos/$REPO/issues/$pr/labels/$REVIEW_LABEL" >/dev/null 2>&1; then
                echo "Removed $REVIEW_LABEL: the new commit has not been reviewed."
              fi
            fi

            reviewed=$(gh api "repos/$REPO/issues/$pr/labels" --jq "any(.[]; .name == \"$REVIEW_LABEL\")")
            auto=$(gh pr view "$pr" -R "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')
            status_ok=$(gh api "repos/$REPO/commits/$sha/status" \
              --jq "any(.statuses[]; .context == \"$JENKINS_STATUS\" and .state == \"success\")")
            check_ok=$(gh api "repos/$REPO/commits/$sha/check-runs?check_name=Jenkins&filter=latest&app_id=$JENKINS_APP_ID" \
              --jq '(.check_runs | sort_by(.started_at) | last | .conclusion) == "success"')
            jenkins=false; [ "$status_ok" = "true" ] && [ "$check_ok" = "true" ] && jenkins=true

            input=$(printf '{"gateDefining":%s,"reviewed":%s,"autoMergeEnabled":%s,"jenkinsPassed":%s}' \
              "$gate" "$reviewed" "$auto" "$jenkins")
            decision=$(node .github/scripts/gate-review.mjs "$input")
            state=${decision%%$'\t'*}; description=${decision#*$'\t'}
            gh api -X POST "repos/$REPO/statuses/$sha" -f state="$state" -f context=gate-review \
              -f description="$description" >/dev/null
            echo "PR #$pr $sha: gate=$gate reviewed=$reviewed autoMerge=$auto jenkins=$jenkins -> gate-review=$state ($description)"

            if [ "$gate" = "true" ] && [ "$auto" = "true" ] && [ "$ACTION" = "auto_merge_enabled" ]; then
              {
                echo "Auto-merge is not allowed on this PR: it changes gate-defining files."
                echo "The required \`gate-review\` status stays failing while auto-merge is enabled."
                echo "Disable auto-merge; after review (label \`$REVIEW_LABEL\`) and a passing Jenkins"
                echo "check, merge it manually. See docs/ci-cd.md."
              } > "$RUNNER_TEMP/comment.md"
              gh pr comment "$pr" -R "$REPO" --body-file "$RUNNER_TEMP/comment.md" >/dev/null
            fi
            trap - ERR
          done
