name: Auto PR and auto-merge

# Integration automation (docs/ci-cd.md). It never merges anything itself and never bypasses a
# rule: it opens the pull request and turns on GitHub's native auto-merge, and GitHub merges only
# when ruleset 24842741 is satisfied (required checks "Jenkins" and
# "continuous-integration/jenkins/pr-head" passed on a branch that is up to date with main; the
# Jenkins PR build is Quality Gates + QA Smoke 4/4). A failed or missing check, or a conflict,
# leaves the pull request open and blocked. UAT approval stays a manual Jenkins input.
#
#   push to any branch except main and wip/**  -> open a PR to main (if none) and enable
#                                                 auto-merge on it unless it is a draft (every push:
#                                                 idempotent, so a failed enable heals on the next push)
#   pull request reopened or marked ready        -> enable auto-merge (drafts and forks: never);
#                                                 "opened" is covered by the push (a PR opened by
#                                                 GITHUB_TOKEN would only leave a run awaiting approval)
#   Jenkins App creates a check run (fallback:  -> "update branch" on auto-merge PRs behind main,
#   every 15 min), or started manually            so Jenkins validates them again against new main;
#                                                 delete the head branch of merged PRs
#
# Races and recursion: one run at a time per branch (push and pull_request share the group);
# GitHub allows one open PR per head and base, and a lost creation race reuses the winner's PR.
# Events caused by GITHUB_TOKEN (the merge, branch updates) start no workflow, and the PR it opens
# matches no trigger here ("opened" is not one; it would wait for approval, seen on PR #30), so
# nothing here triggers itself. Jenkins still receives them through its GitHub App webhook.
#
# Merges made through auto-merge enabled by GITHUB_TOKEN do not start workflows and do not trigger
# GitHub's "automatically delete head branches" (observed on PR #29), so the sweep deletes those
# branches itself. It starts on the check runs of the Jenkins GitHub App (4991392) on PR heads:
# when one succeeds it waits for the auto-merge and deletes that PR's branch at once. GitHub starts
# no workflow for a check run whose head SHA is associated with GitHub Actions (docs, check_run
# event), i.e. Jenkins' checks on main's merge commits made by this automation, and none for
# GITHUB_TOKEN events; the schedule never fired either (2026-10-15), so it is only a fallback.
# Check runs created by GitHub Actions start no workflow, so the sweep cannot trigger itself.
on:
  push:
    branches-ignore:
      - main
      - 'wip/**'
  pull_request:
    types: [reopened, ready_for_review]
    branches: [main]
  check_run:
    types: [created, completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.event.pull_request.head.ref || (github.event_name == 'push' && github.ref_name) || github.event.check_run.head_sha || 'sweep' }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}

jobs:
  open-pr:
    name: Open PR and enable auto-merge
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open the pull request
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          open_pr() { gh pr list -R "$REPO" --head "$BRANCH" --base main --state open --json number,isDraft --jq '.[0] // empty | "\(.number) \(.isDraft)"'; }
          enable() {
            if [ "$2" = "true" ]; then echo "PR #$1 is a draft: auto-merge not enabled."; return; fi
            gh pr merge -R "$REPO" "$1" --auto --merge
            echo "Auto-merge enabled for PR #$1 (GitHub merges after the required checks pass)."
          }
          read -r number draft <<<"$(open_pr)" || true
          if [ -n "${number:-}" ]; then
            echo "PR #$number already open for $BRANCH."
            enable "$number" "$draft"
            exit 0
          fi
          ahead=$(gh api "repos/$REPO/compare/main...$BRANCH" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "$BRANCH has no commits ahead of main; no PR."
            exit 0
          fi
          title=$(gh api "repos/$REPO/compare/main...$BRANCH" --jq '.commits[0].commit.message | split("\n")[0]')
          {
            echo "Opened automatically for \`$BRANCH\` (docs/ci-cd.md). Auto-merge is enabled: GitHub merges"
            echo "only after the required Jenkins checks (Quality Gates + QA Smoke 4/4) pass on an up-to-date"
            echo "branch. Convert it to draft to hold it (every push re-enables auto-merge on a ready PR)."
            echo
            echo "Commits:"
            gh api "repos/$REPO/compare/main...$BRANCH" --jq '.commits[] | "- " + (.commit.message | split("\n")[0])'
          } > body.md
          if ! gh pr create -R "$REPO" --base main --head "$BRANCH" --title "$title" --body-file body.md; then
            echo "Creation failed; reusing the PR opened concurrently, if any."
          fi
          read -r number draft <<<"$(open_pr)" || true
          if [ -z "${number:-}" ]; then
            echo "::error::No open PR for $BRANCH after the creation attempt."
            exit 1
          fi
          enable "$number" "$draft"

  enable-auto-merge:
    name: Enable auto-merge
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'wip/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: gh pr merge -R "$REPO" "${{ github.event.pull_request.number }}" --auto --merge

  sweep:
    name: Update PRs behind main and delete merged branches
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'check_run' && github.event.check_run.app.id == 4991392)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A successful Jenkins check on a PR head is what lets auto-merge merge it moments later; this
      # run waits for that merge so the PR's own branch is deleted right after it. (The check runs
      # Jenkins creates on main's merge commits start no workflow: that commit is associated with
      # GitHub Actions, see the header.)
      - name: Wait for the merge of this check's PR
        if: github.event_name == 'check_run' && github.event.action == 'completed' && github.event.check_run.conclusion == 'success'
        env:
          PRS: ${{ join(github.event.check_run.pull_requests.*.number, ' ') }}
        run: |
          set -euo pipefail
          for pr in $PRS; do
            for _ in $(seq 1 45); do
              read -r state auto <<<"$(gh pr view -R "$REPO" "$pr" --json state,autoMergeRequest --jq '"\(.state) \(.autoMergeRequest != null)"')"
              if [ "$state" != "OPEN" ]; then echo "PR #$pr is $state."; break; fi
              if [ "$auto" != "true" ]; then echo "PR #$pr has no auto-merge; not waiting."; break; fi
              sleep 20
            done
          done
      - name: Update branches
        run: |
          set -euo pipefail
          gh pr list -R "$REPO" --base main --state open \
            --json number,isDraft,mergeStateStatus,autoMergeRequest,isCrossRepository \
            --jq '.[] | select(.autoMergeRequest != null and .isDraft == false and .isCrossRepository == false and .mergeStateStatus == "BEHIND") | .number' |
          while read -r pr; do
            # Fails (and is reported) on a conflict: the PR stays blocked for a person to resolve.
            gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" --silent && echo "PR #$pr updated with main" || echo "::warning::PR #$pr could not be updated (conflict)"
          done
      - name: Delete head branches of merged PRs
        run: |
          set -euo pipefail
          # Eligible only: PR merged (hence closed) into main by this automation (a person's merge
          # triggers delete_branch_on_merge instead), branch not main and not protected, still at the
          # merged commit (work pushed after the merge is kept) and backing no open PR.
          gh pr list -R "$REPO" --base main --state merged --limit 30 \
            --json number,headRefName,headRefOid,isCrossRepository,mergedBy \
            --jq '.[] | select(.isCrossRepository == false) | "\(.number) \(.headRefOid) \(.headRefName) \(.mergedBy.login // "-")"' |
          while read -r pr sha branch by; do
            current=$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null) || continue # already deleted
            decision() { echo "PR #$pr $branch: $1"; }
            case "$by" in *github-actions*) ;; *) decision "kept (merged by $by, not the automation)"; continue ;; esac
            if [ "$branch" = "main" ] || [ "$(gh api "repos/$REPO/branches/$branch" --jq '.protected')" != "false" ]; then
              decision "kept (main or protected)"; continue
            fi
            if [ "$current" != "$sha" ]; then decision "kept (moved after the merge: ${current:0:7} != ${sha:0:7})"; continue; fi
            if [ -n "$(gh pr list -R "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
              decision "kept (backs an open PR)"; continue
            fi
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" --silent 2>/dev/null; then
              decision "DELETED (merged by $by at ${sha:0:7})"
            elif ! gh api "repos/$REPO/git/ref/heads/$branch" --silent 2>/dev/null; then
              decision "already deleted by a concurrent run"
            else
              echo "::warning::PR #$pr $branch: deletion failed"
            fi
          done
